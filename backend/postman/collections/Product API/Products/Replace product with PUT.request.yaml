$kind: http-request
url: "{{base_url}}/products/{{product_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Runner Product Updated",
      "description": "Updated by Postman Runner",
      "price": 16000,
      "stock": 3
    }
scripts:
  - type: afterResponse
    code: pm.test('put product returns 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
