$kind: http-request
url: "{{base_url}}/products/{{product_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('get product returns 200', () => pm.response.to.have.status(200));
      pm.test('response id matches product_id', () => pm.expect(pm.response.json().data.id).to.eql(Number(pm.environment.get('product_id'))));
    language: text/javascript
order: 4000
