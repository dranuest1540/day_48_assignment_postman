$kind: http-request
description: Requires the token saved automatically by the Login request.
url: "{{base_url}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('/auth/me returns 200', () => pm.response.to.have.status(200));
      pm.test('current user matches registered account', () => pm.expect(pm.response.json().data.id).to.eql(Number(pm.environment.get('registered_user_id'))));
    language: text/javascript
order: 4000
