$kind: http-request
url: "{{base_url}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Student",
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.environment.set('email', 'student.' + Date.now() + '@example.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('register returns 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('response does not expose password', () => pm.expect(body.data).not.to.have.property('password'));
      pm.environment.set('registered_user_id', body.data.id);
    language: text/javascript
order: 1000
