$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "definitely-wrong-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('invalid credentials return 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
